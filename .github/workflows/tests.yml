name: FNXRepeater checks

on:
  push:
  pull_request:

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer
      - name: Composer metadata
        run: composer validate --no-check-publish
      - name: PHP syntax
        run: find src lang -name '*.php' -exec php -l '{}' ';'
      - name: PHP column smoke
        run: php -d zend.assertions=1 tests/php/column-smoke.php
      - name: JS tests
        run: npm test
